services:
  postgres:
    image: postgres:16-alpine
    container_name: sica-postgres
    environment:
      POSTGRES_DB: sica_db
      POSTGRES_USER: sica_user
      POSTGRES_PASSWORD: sica_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sica_user -d sica_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sica-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sica-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  sica-network:
    driver: bridge
